# ==============================================================================
# DIGITALFIX - PORTAL CLIENTE (monolito: frontend React + backend Spring Boot)
# ==============================================================================
# Uso:
#   1. cp .env.example .env   (y completar PORTAL_DB_PASSWORD, PORTAL_JWT_SECRET, PORTAL_API_KEY)
#   2. Levantar antes digitalfix-infrastructure (crea la red digitalfix-net con ms-catalog y
#      ms-workorders). Para probar el portal sin el ERP: docker network create digitalfix-net
#   3. docker compose up -d --build
#   4. Portal: http://localhost:${PORTAL_FRONTEND_PORT:-3000}
#      Swagger del backend: http://localhost:${PORTAL_BACKEND_PORT:-8091}/swagger-ui.html
#
# El navegador solo habla con el contenedor del frontend (nginx), que reenvía /api/v1 al backend.
# El backend consume ms-catalog y ms-workorders por la red interna digitalfix-net.
# ==============================================================================

name: digitalfix-portal-cliente

networks:
  # Red propia: solo backend ↔ base de datos.
  portal-net:
    name: digitalfix-portal-net
  # Red del ERP (la crea digitalfix-infrastructure): ms-catalog-service y ms-workorders-service.
  digitalfix-net:
    name: digitalfix-net
    external: true

volumes:
  portal-db-data:
    name: digitalfix-portal-db-data

services:

  # ----------------------------------------------------------------------------
  # 1. Base de datos del portal (portal_db): usuarios, capa comercial, cupones y pedidos
  # ----------------------------------------------------------------------------
  portal-db:
    image: postgres:16-alpine
    container_name: digitalfix-portal-db
    mem_limit: ${PORTAL_DB_MEMORY:-256m}
    environment:
      - POSTGRES_DB=portal_db
      - POSTGRES_USER=${PORTAL_DB_USER:-portal}
      - POSTGRES_PASSWORD=${PORTAL_DB_PASSWORD:?Define PORTAL_DB_PASSWORD en .env}
    volumes:
      - portal-db-data:/var/lib/postgresql/data
    # Sin "ports": solo accesible por el backend.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d portal_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - portal-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Backend del portal (Spring Boot, identidad y JWT propios)
  # ----------------------------------------------------------------------------
  portal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: digitalfix/portal-cliente-backend:latest
    container_name: portal-backend
    mem_limit: ${PORTAL_BACKEND_MEMORY:-448m}
    expose:
      - "8090"
    # Publicado solo en localhost para Swagger y pruebas; el tráfico normal entra por el frontend.
    ports:
      - "127.0.0.1:${PORTAL_BACKEND_PORT:-8091}:8090"
    environment:
      - SERVER_PORT=8090
      - SPRING_DATASOURCE_URL=jdbc:postgresql://portal-db:5432/portal_db
      - SPRING_DATASOURCE_USERNAME=${PORTAL_DB_USER:-portal}
      - SPRING_DATASOURCE_PASSWORD=${PORTAL_DB_PASSWORD}
      - SPRING_JPA_DDL_AUTO=${PORTAL_JPA_DDL_AUTO:-update}
      - CORS_ALLOWED_ORIGINS=${PORTAL_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - PORTAL_JWT_SECRET=${PORTAL_JWT_SECRET:?Define PORTAL_JWT_SECRET en .env (32+ caracteres)}
      - PORTAL_JWT_EXPIRACION_MINUTOS=${PORTAL_JWT_EXPIRACION_MINUTOS:-60}
      - PORTAL_JWT_EXPIRACION_REFRESH_DIAS=${PORTAL_JWT_EXPIRACION_REFRESH_DIAS:-7}
      - PORTAL_DATOS_DEMO=${PORTAL_DATOS_DEMO:-false}
      - PORTAL_MINUTOS_RESERVA_STOCK=${PORTAL_MINUTOS_RESERVA_STOCK:-30}
      # Nombres de contenedor del ERP en digitalfix-net (ver digitalfix-infrastructure).
      - MS_CATALOG_URL=${MS_CATALOG_URL:-http://ms-catalog-service:8080}
      - MS_WORKORDERS_URL=${MS_WORKORDERS_URL:-http://ms-workorders-service:8080}
      # Debe ser igual a PORTAL_API_KEY de ms-workorders.
      - MS_WORKORDERS_API_KEY=${PORTAL_API_KEY:-}
      - JAVA_OPTS=${JAVA_OPTS:--Djava.net.preferIPv4Stack=true}
      - JDK_JAVA_OPTIONS=${JVM_MEMORY_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k}
    networks:
      - portal-net
      - digitalfix-net
    depends_on:
      portal-db:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Frontend del portal (React compilado, servido por nginx)
  # ----------------------------------------------------------------------------
  portal-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: digitalfix/portal-cliente-frontend:latest
    container_name: portal-frontend
    mem_limit: ${PORTAL_FRONTEND_MEMORY:-64m}
    ports:
      - "${PORTAL_FRONTEND_PORT:-3000}:80"
    environment:
      - PORTAL_BACKEND_URL=http://portal-backend:8090
    networks:
      - portal-net
    depends_on:
      - portal-backend
    restart: unless-stopped
